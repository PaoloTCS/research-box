name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Make python3 available on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $py = (Get-Command python).Source
          $py3 = Join-Path (Split-Path $py) "python3.exe"
          if (-not (Test-Path $py3)) { Copy-Item $py $py3 }
          python3 --version
      - name: Unit tests
        run: python -m unittest discover tests -v
      - name: Example drop, check and reproduce
        shell: bash
        run: |
          out="$RUNNER_TEMP/prime-share"
          python research-box/scripts/build_box.py examples/prime-numbers --for shareable --out "$out"
          python research-box/scripts/build_box.py "$out" --check
          python research-box/scripts/build_box.py "$out" --reproduce --yes
