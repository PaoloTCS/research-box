name: rerun

# Reruns a research-box drop three times on GitHub's machines with no network, and signs the
# result with GitHub's keyless artifact attestation (Sigstore). Started by a maintainer, or by
# the rerun request workflow for a "Rerun request" issue; with no drop_url it reruns the example
# box. On pull requests, and with dry_run, it reruns and checks but signs and publishes nothing.

on:
  workflow_dispatch:
    inputs:
      drop_url:
        description: "https address of a drop archive (.tar.gz of a folder made with --out); leave empty to rerun the example box"
        required: false
        default: ""
      drop_sha256:
        description: "sha256 of that archive, as sha256sum prints it (needed with drop_url)"
        required: false
        default: ""
      submitter:
        description: "who asked for the rerun (name or ORCID), shown on the report"
        required: false
        default: ""
      issue_number:
        description: "rerun request issue to answer when done (set by the rerun request workflow)"
        required: false
        default: ""
      dry_run:
        description: "test only: run and check, but sign and publish nothing"
        type: boolean
        required: false
        default: false
  pull_request:
    paths:
      - ".github/workflows/rerun.yml"
      - ".github/rerun/**"
      - "research-box/scripts/build_box.py"

permissions: {}

concurrency:
  group: rerun-${{ github.run_id }}

jobs:
  fetch:
    # Gets the drop and nothing else. Never runs the box.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    outputs:
      sha256: ${{ steps.get.outputs.sha256 }}
      url: ${{ steps.get.outputs.url }}
    steps:
      - uses: actions/checkout@v5
      - name: Get the drop
        id: get
        env:
          DROP_URL: ${{ inputs.drop_url }}
          DROP_SHA256: ${{ inputs.drop_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/in"
          if [ -n "$DROP_URL" ]; then
            [ -n "$DROP_SHA256" ] || { echo "drop_url needs drop_sha256"; exit 2; }
            case "$DROP_URL" in https://*) ;; *) echo "drop_url must start with https://"; exit 2;; esac
            curl --fail --location --proto '=https' --max-filesize 52428800 --max-time 120 \
              --output "$RUNNER_TEMP/in/drop.tar.gz" -- "$DROP_URL"
            echo "$DROP_SHA256  $RUNNER_TEMP/in/drop.tar.gz" | sha256sum --check --strict
            url="$DROP_URL"
          else
            python3 research-box/scripts/build_box.py examples/prime-numbers --for shareable \
              --out "$RUNNER_TEMP/self-test/prime-numbers"
            tar -C "$RUNNER_TEMP/self-test" -czf "$RUNNER_TEMP/in/drop.tar.gz" prime-numbers
            url="examples/prime-numbers at ${{ github.sha }}"
          fi
          echo "sha256=$(sha256sum "$RUNNER_TEMP/in/drop.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: drop
          path: ${{ runner.temp }}/in/drop.tar.gz
          retention-days: 7

  rerun:
    # Runs the box's own code three times, with no network and no credentials.
    needs: fetch
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: drop
          path: ${{ runner.temp }}/in
      - name: Unpack
        run: python3 .github/rerun/unpack.py "$RUNNER_TEMP/in/drop.tar.gz" "$RUNNER_TEMP/drop"
      - name: Allow user namespaces, so the runs can have no network
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Three runs, no network
        run: |
          mkdir -p "$RUNNER_TEMP/runs"
          # Each run gets the box's own timeout, capped at 5 minutes.
          cap=$(python3 -I -c 'import json,sys
          try: t=float(json.load(open(sys.argv[1]))["reproduce"].get("timeout_seconds", 300))
          except Exception: t=300
          print(min(t, 300) if t > 0 else 300)' "$RUNNER_TEMP/drop/box.json")
          for i in 1 2 3; do
            python3 research-box/scripts/build_box.py "$RUNNER_TEMP/drop" --reproduce --yes \
              --no-network --timeout "$cap" --report "$RUNNER_TEMP/runs/run-$i.json" || echo "run $i exit $?"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: runs
          path: ${{ runner.temp }}/runs/run-*.json
          retention-days: 7

  attest:
    # Checks the run reports against the drop, signs, and publishes. Never runs the box.
    needs: [fetch, rerun]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: drop
          path: ${{ runner.temp }}/in
      - uses: actions/download-artifact@v4
        with:
          name: runs
          path: ${{ runner.temp }}/runs
      - name: Check the drop is the one fetched
        run: echo "${{ needs.fetch.outputs.sha256 }}  $RUNNER_TEMP/in/drop.tar.gz" | sha256sum --check --strict
      - name: Assemble the report
        env:
          SOURCE_URL: ${{ needs.fetch.outputs.url }}
          SUBMITTER: ${{ inputs.submitter }}
        run: |
          python3 .github/rerun/unpack.py "$RUNNER_TEMP/in/drop.tar.gz" "$RUNNER_TEMP/drop"
          python3 .github/rerun/assemble.py --drop "$RUNNER_TEMP/drop" --runs "$RUNNER_TEMP/runs" \
            --out "$RUNNER_TEMP/out" --repository "${{ github.repository }}" \
            --workflow-run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --workflow-sha "${{ github.sha }}" --runner-image "$ImageOS $ImageVersion" \
            --source-url "$SOURCE_URL" --source-sha256 "${{ needs.fetch.outputs.sha256 }}" \
            --submitter "$SUBMITTER"
      - name: Sign the report (keyless, Sigstore)
        id: sign
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/out/report.json
      - name: Publish to the certificates branch (served as the public site)
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.sign.outputs.bundle-path }}
        run: |
          set -euo pipefail
          if [ -n "$BUNDLE" ] && [ -f "$BUNDLE" ]; then cp "$BUNDLE" "$RUNNER_TEMP/out/report.sigstore.json"; fi
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          site="$RUNNER_TEMP/site"
          if git ls-remote --exit-code --heads "$remote" certificates >/dev/null; then
            git clone --quiet --depth 1 --branch certificates "$remote" "$site"
          else
            git init --quiet "$site" && git -C "$site" checkout --quiet --orphan certificates
          fi
          mkdir -p "$site/r/${{ github.run_id }}"
          cp "$RUNNER_TEMP"/out/* "$site/r/${{ github.run_id }}/"
          python3 .github/rerun/index.py "$site"
          git -C "$site" add -A
          git -C "$site" -c user.name="research-box rerun" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Rerun ${{ github.run_id }}"
          git -C "$site" push --quiet "$remote" HEAD:certificates
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: ${{ runner.temp }}/out/
          retention-days: 90

  reply:
    # Answers the rerun request issue, if there is one. Never runs the box.
    needs: [fetch, rerun, attest]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.issue_number != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: report
          path: ${{ runner.temp }}/report
      - name: Comment and close
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue_number }}
          DRY_RUN: ${{ inputs.dry_run }}
          SITE: ${{ vars.RERUN_SITE || 'https://reruns.thecornerstore.ai' }}
        run: |
          set -euo pipefail
          case "$ISSUE" in ''|*[!0-9]*) echo "not an issue number"; exit 2;; esac
          report="$RUNNER_TEMP/report/report.json"
          if [ "${{ needs.attest.result }}" != success ]; then report=""; fi
          python3 .github/rerun/reply.py --report "$report" --site "$SITE" \
            --run-url "${{ github.server_url }}/$REPO/actions/runs/${{ github.run_id }}" \
            --run-id "${{ github.run_id }}" --dry-run "$DRY_RUN" --out "$RUNNER_TEMP/reply.md"
          gh issue comment "$ISSUE" --repo "$REPO" --body-file "$RUNNER_TEMP/reply.md"
          gh issue close "$ISSUE" --repo "$REPO" --reason completed
